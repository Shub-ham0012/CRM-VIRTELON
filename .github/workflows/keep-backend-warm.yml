name: Keep backend warm

# Render's free tier puts the backend to sleep after 15 minutes idle,
# causing a ~30-60s cold-start failure on the next request. Pinging it
# every 5 minutes keeps it from ever going idle long enough to sleep.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: curl -sf -m 30 https://virtelon-command-centre-backend.onrender.com/api || true
